# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

# read more about configuring hatch at:
# https://hatch.pypa.io/latest/config/build/
[tool.hatch.build.targets.wheel]
packages = ["src/fractal_nnunet"]


# Project metadata (see https://peps.python.org/pep-0621)
[project]
name = "fractal-nnunet"
dynamic = ["version"]
description = "Semantic segmentation with nnUnet."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Nicole Repina", email = "nicole.repina@fmi.ch" },
]

# Required Python version and dependencies
requires-python = ">=3.11"
dependencies = ["ngio>=0.2.1", "scikit-image", "fractal-task-tools", "fractal-tasks-core==1.3.4"]

# Optional dependencies (e.g. for `pip install -e ".[dev]"`, see
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies)
[project.optional-dependencies]
dev = ["devtools", "hatch", "pytest", "requests", "jsonschema", "ruff", "pre-commit"]
