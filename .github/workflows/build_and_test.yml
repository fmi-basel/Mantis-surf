name: CI (build and test)

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  tests:
    name: Test with Pixi (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: default dev
          locked: true

      - name: Check if manifest has changed
        run: pixi run --locked -e default fractal-manifest check --package mantis_surf

      - name: Test core library with pytest
        run: pixi run --locked -e dev python -m pytest tests

  deploy:
    name: Deploy
    needs: tests
    if: success() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule'
    runs-on: ubuntu-latest

    permissions:
      # Required for trusted publishing on PyPI
      id-token: write
      # Required for creating GitHub releases
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        # Remove "if: false" when ready for PyPI release
        if: false
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./dist/*
            pixi.lock
          fail_on_unmatched_files: true
