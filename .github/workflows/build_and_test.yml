name: CI (build and test)

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.11"]

    name: "Core, Python ${{ matrix.python-version }}, ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: fractal-nnunet
          auto-activate-base: false
          channels: conda-forge,defaults

      - name: Install python-elf
        run: conda install -y -c conda-forge python-elf

      - name: Install PyTorch
        run: python -m pip install torch torchvision

      - name: Install nnUNet
        run: python -m pip install nnunetv2

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Check if manifest has changed
        run: fractal-manifest check --package fractal_nnunet

      - name: Test core library with pytest
        run: python -m pytest tests

  deploy:
    name: Deploy
    needs: tests
    if: success() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule'
    runs-on: ubuntu-latest

    permissions:
      # Required for trusted publishing on PyPI
      id-token: write
      # Required for creating GitHub releases
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        # Remove "if: false" when ready for PyPI release
        if: false
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: './dist/*'
